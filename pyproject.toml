[project]
name = "xjepa"
version = "0.1.0"
description = "Cross-modal JEPA for protein sequences: frozen structure targets vs MLM under matched compute"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
